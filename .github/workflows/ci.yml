name: LfSrcHarness CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run ruff check src tests
      - run: uv run pytest --cov=lfsrc_harness --cov-report=xml --cov-report=html --cov-report=term-missing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.os }}
          path: |
            coverage.xml
            htmlcov/

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp deploy/.env.example deploy/.env
      - run: docker compose -f deploy/docker-compose.yml config --quiet
      - run: bash -n deploy/install.sh
      - run: python -m pip install ansible-core
      - run: ansible-playbook --syntax-check -i deploy/ansible/inventory/hosts.ini deploy/ansible/site.yml

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp deploy/.env.example deploy/.env
      - run: docker compose -f deploy/docker-compose.yml build api
      - run: docker compose -f deploy/docker-compose.yml up -d redis postgres api
      - run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8619/health; then exit 0; fi
            sleep 2
          done
          docker compose -f deploy/docker-compose.yml logs api
          exit 1
      - if: always()
        run: docker compose -f deploy/docker-compose.yml down --volumes
